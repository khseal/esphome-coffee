# Sonoff Dual R3 v1 (CSE7761)
# Кофеварка: реле всегда ON после старта (управление из HA), физ. кнопок нет
# S2 — кнопка кофемолки: по времени ИЛИ по весу Timemore
#
# Подставьте IP/hostname Gaggiuino ниже. С Gaggiuino берётся только профиль и доза.
# Целевой вес помола: recipe.coffeeIn (dose), не globalStopConditions.weight.
# Остановка по весу: прирост на весах от момента старта (можно не тарить до 0).
# Timemore Scale: переключатель «Timemore Scale». Пока он включён и весы подключены,
# помол идёт по весу Black Mirror Dot (имя TIMEMORE_Dot).
# Телефон к весам в этот момент не подключать: Dot держит одно соединение.

substitutions:
  name: coffee
  grind_default_s: "15"
  gaggiuino_host: "192.168.5.14"
  # аварийный таймаут помола по весу
  grind_weight_max_s: "90"
  # выключить кофеварку, если столько времени ничего не делали
  coffee_idle_off: 3h

esphome:
  name: ${name}
  friendly_name: Coffee
  on_boot:
    - priority: -100
      then:
        - script.execute: coffee_idle_timer
        # переключатель Timemore восстанавливается без on_turn_on — поиск весов запускаем сами
        - script.execute: dot_scan_later
        - lambda: |-
            id(grind_lead).publish_state(id(grind_lead_s));
            if (id(grind_rate_gps) >= 0.4f)
              id(grind_flow).publish_state(id(grind_rate_gps));
            if (!isnan(id(grind_last_error_g)))
              id(grind_error).publish_state(id(grind_last_error_g));

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      # чип rev3.1 + flash GigaDevice — убирает предупреждения в логе
      minimum_chip_revision: "3.1"
      flash_chip: gd
      # загрузчик уже обновлён и поддерживает +40KB IRAM
      sram1_as_iram: true

logger:
  baud_rate: 0
  logs:
    # лишний опрос notify-характеристики Dot пишет status=2, вес идёт уведомлениями
    ble_sensor: ERROR

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # Нужно для OTA-миграции partition table (у Dual R3 нет удобного USB)
    allow_partition_access: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  # далеко от роутера / нестабильный линк до Gaggiuino
  power_save_mode: none
  ap:
    ssid: "${name} Fallback Hotspot"
    password: !secret web_server_password

captive_portal:

http_request:
  # DNS/mDNS до недоступного хоста долго блокирует loop — поднимаем WDT на время запроса
  timeout: 3s
  watchdog_timeout: 30s
  verify_ssl: false
  # статус ~1 КБ, полный профиль с фазами легко больше 4 КБ
  buffer_size_rx: 8192

json:

esp32_ble:
  # Gaggiuino находит весы по имени, начинающемуся с «Decent Scale»
  name: Decent Scale
  # Dot спаривается Just Works, как приложение Timemore
  io_capability: none
  auth_req_mode: sc_bond

# Для Gaggiuino Dual R3 притворяется Decent Scale и пересылает вес Timemore.
esp32_ble_server:
  id: decent_server
  manufacturer: Decent
  model: Decent Scale
  on_connect:
    - lambda: |-
        id(decent_client) = true;
        id(decent_conn) = id;
        ESP_LOGI("decent", "Gaggiuino connected conn=%u", id);
  on_disconnect:
    - lambda: |-
        id(decent_client) = false;
        ESP_LOGI("decent", "Gaggiuino disconnected");
  services:
    - uuid: FFF0
      advertise: true
      characteristics:
        - id: decent_weight
          uuid: FFF4
          read: true
          notify: true
          value:
            data: [0x03, 0xCE, 0x00, 0x00, 0x00, 0x00, 0xCD]
        # 03 0F … 0C — тара от Gaggiuino, остальные команды Decent не нужны
        - uuid: 36F5
          write: true
          write_no_response: true
          on_write:
            - lambda: |-
                ESP_LOGI("decent", "Gaggiuino command %02X %02X len=%u",
                         x.size() > 0 ? x[0] : 0, x.size() > 1 ? x[1] : 0, (unsigned) x.size());
            - if:
                condition:
                  lambda: return x.size() >= 2 && x[0] == 0x03 && x[1] == 0x0F;
                then:
                  - script.execute: dot_tare

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    # скан только пока Timemore включена и ещё не подключена, иначе Wi-Fi проседает
    # active: имя TIMEMORE_Dot приходит в scan response
    continuous: false
    duration: 15s
    active: true
    # по умолчанию при Wi-Fi скан слушает всё время и душит соединение с Gaggiuino
    interval: 320ms
    window: 30ms
  on_scan_end:
    - script.execute: dot_scan_later
  on_ble_advertise:
    - then:
        - lambda: |-
            if (!id(use_dot).state || id(dot_connecting) || id(dot_scale).connected())
              return;
            std::string name(x.get_name().c_str());
            if (name.find("TIMEMORE_Dot") == std::string::npos)
              return;
            char addr[32];
            ESP_LOGI("scale", "Timemore %s", x.address_str_to(addr));
            id(dot_scale).set_address(x.address_uint64());
            id(dot_scale).set_remote_addr_type(x.get_address_type());
            id(dot_connecting) = true;
            id(ble_tracker).stop_scan();
            id(dot_scale).connect();

ble_client:
  - mac_address: "00:00:00:00:00:00"
    id: dot_scale
    # адрес подставляется из объявления TIMEMORE_Dot
    auto_connect: false
    on_connect:
      then:
        - lambda: |-
            id(dot_connecting) = false;
            id(dot_release) = false;
        - binary_sensor.template.publish:
            id: dot_connected
            state: ON
        # FFF2 — запись команд. Запомнить до освобождения кэша GATT
        - lambda: |-
            id(dot_tare_handle) = 0;
            id(dot_tare_props) = 0;
            auto *chr = id(dot_scale).get_characteristic(0xFFF0, 0xFFF2);
            if (chr == nullptr) {
              ESP_LOGW("grind", "Timemore FFF2 not found, tare unavailable");
              return;
            }
            id(dot_tare_handle) = chr->handle;
            id(dot_tare_props) = chr->properties;
            ESP_LOGI("grind", "Timemore FFF2 handle=%u props=0x%02X", chr->handle, chr->properties);
        # Dot отдаёт поток только сопряжённому клиенту, как приложению Timemore
        - lambda: |-
            id(dot_cccd_handle) = 0;
            auto *ntf = id(dot_scale).get_characteristic(0xFFF0, 0xFFF1);
            if (ntf != nullptr) {
              auto *d = ntf->get_descriptor(0x2902);
              if (d != nullptr)
                id(dot_cccd_handle) = d->handle;
            }
            esp_err_t err = esp_ble_set_encryption(id(dot_scale).get_remote_bda(), ESP_BLE_SEC_ENCRYPT_NO_MITM);
            ESP_LOGI("scale", "Timemore pairing err=%d cccd=%u", (int) err, id(dot_cccd_handle));
        - logger.log: "Timemore connected"
        - script.execute: dot_hello
    on_disconnect:
      then:
        - lambda: |-
            id(dot_connecting) = false;
            id(dot_tare_handle) = 0;
            id(dot_tare_props) = 0;
            id(dot_cccd_handle) = 0;
            if (id(use_dot).state)
              id(dot_release) = true;
        - binary_sensor.template.publish:
            id: dot_connected
            state: OFF
        - logger.log: "Timemore disconnected"
        - script.stop: dot_scan_now
        - script.stop: dot_scan_later
        - script.stop: dot_hello
        - esp32_ble_tracker.stop_scan:
        - if:
            condition:
              switch.is_on: use_dot
            then:
              - script.execute: dot_back_later

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      # сброс месячного счётчика 1-го числа в 00:00
      - seconds: 0
        minutes: 0
        hours: 0
        days_of_month: 1
        then:
          - sensor.integration.reset: energy_month

uart:
  tx_pin: GPIO25
  rx_pin: GPIO26
  baud_rate: 38400
  parity: EVEN
  stop_bits: 1

globals:
  - id: grind_start_weight
    type: float
    restore_value: false
    initial_value: "0"
  # секунды, которые кофе ещё падает после выключения мотора; подстраивается после помола
  - id: grind_lead_s
    type: float
    restore_value: true
    initial_value: "0.5"
  # последний устойчивый поток, г/с
  - id: grind_rate_gps
    type: float
    restore_value: true
    initial_value: "0"
  - id: grind_prev_g
    type: float
    restore_value: false
    initial_value: "0"
  - id: grind_prev_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: grind_cutoff_g
    type: float
    restore_value: false
    initial_value: "0"
  # последний перелёт (>0) или недобор (<0) после оседания, г
  - id: grind_last_error_g
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: grind_target_g
    type: float
    restore_value: false
    initial_value: "18"
  - id: gaggiuino_profile_id
    type: int
    restore_value: false
    initial_value: "0"
  - id: gaggiuino_profile_id_fetched
    type: int
    restore_value: false
    initial_value: "-1"
  # защита от script.stop внутри on_turn_off во время штатного выключения скриптом
  - id: grind_stopping
    type: bool
    restore_value: false
    initial_value: "false"
  # таймер простоя сам выключает реле — не останавливать скрипт из on_turn_off
  - id: coffee_idle_firing
    type: bool
    restore_value: false
    initial_value: "false"
  - id: need_profile_fetch
    type: bool
    restore_value: false
    initial_value: "false"
  # handle FFF2 (команды Dot), снятый в момент подключения, пока кэш GATT ещё жив
  - id: dot_tare_handle
    type: uint16_t
    restore_value: false
    initial_value: "0"
  - id: dot_tare_props
    type: uint8_t
    restore_value: false
    initial_value: "0"
  # скрипт тарирования ставит true только в самом конце; помол ждёт этот флаг
  - id: dot_tare_done
    type: bool
    restore_value: false
    initial_value: "false"
  # поток, который Dot сам кладёт в кадр веса, г/с
  - id: dot_flow_gps
    type: float
    restore_value: false
    initial_value: "0"
  - id: dot_connecting
    type: bool
    restore_value: false
    initial_value: "false"
  - id: decent_client
    type: bool
    restore_value: false
    initial_value: "false"
  - id: decent_conn
    type: uint16_t
    restore_value: false
    initial_value: "0"
  # сервер сам включает рекламу при старте; дальше её держим только пока Timemore отдаёт вес
  - id: decent_adv
    type: bool
    restore_value: false
    initial_value: "true"
  # время последнего кадра веса Timemore
  - id: dot_last_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: dot_cccd_handle
    type: uint16_t
    restore_value: false
    initial_value: "0"
  - id: dot_hello_i
    type: uint8_t
    restore_value: false
    initial_value: "0"
  # не искать весы: переключатель выключен или идёт пауза после обрыва
  - id: dot_release
    type: bool
    restore_value: false
    initial_value: "false"

number:
  - platform: template
    name: Grind Time
    id: grind_seconds
    icon: mdi:timer-outline
    unit_of_measurement: s
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${grind_default_s}
    min_value: 0.1
    max_value: 120
    step: 0.1
    mode: box

  # Если > 0 — перекрывает вес из профиля Gaggiuino
  - platform: template
    name: Grind Target Override
    id: grind_target_override
    icon: mdi:weight-gram
    unit_of_measurement: g
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 50
    step: 0.1
    mode: box

  # Граммы упреждения на последнем измеренном потоке. После помола пересчитывается само.
  - platform: template
    name: Grind Stop Early
    id: grind_stop_early
    icon: mdi:arrow-collapse-up
    unit_of_measurement: g
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 1.0
    min_value: 0
    max_value: 5
    step: 0.1
    mode: box
    on_value:
      - lambda: |-
          if (id(grind_rate_gps) < 0.4f)
            return;
          float lead = x / id(grind_rate_gps);
          if (lead < 0.15f) lead = 0.15f;
          if (lead > 2.0f) lead = 2.0f;
          id(grind_lead_s) = lead;
          id(grind_lead).publish_state(lead);

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic

  - platform: template
    name: Grinder Button
    icon: mdi:gesture-tap-button
    on_press:
      - script.execute: grind_button

  - platform: template
    name: Scale Tare
    icon: mdi:scale-balance
    entity_category: config
    on_press:
      - script.execute: dot_tare

  # После сброса весов старый ключ сопряжения не подходит — забыть его и сопрячь заново
  - platform: template
    name: Timemore Unpair
    icon: mdi:bluetooth-off
    entity_category: config
    on_press:
      - lambda: |-
          int n = esp_ble_get_bond_device_num();
          if (n > 0) {
            std::vector<esp_ble_bond_dev_t> list(n);
            esp_ble_get_bond_device_list(&n, list.data());
            for (int i = 0; i < n; i++)
              esp_ble_remove_bond_device(list[i].bd_addr);
          }
          ESP_LOGI("scale", "Timemore bonds removed: %d", n);
          if (id(dot_scale).connected())
            id(dot_scale).disconnect();

light:
  - platform: status_led
    name: Status LED
    id: led_status
    entity_category: diagnostic
    pin:
      number: GPIO13
      inverted: true

text_sensor:
  - platform: template
    name: Gaggiuino Profile
    id: gaggiuino_profile_name
    icon: mdi:coffee-maker-outline
    update_interval: never

sensor:
  - platform: cse7761
    update_interval: 21s
    voltage:
      name: Voltage
    current_1:
      name: Current Coffee Maker
      disabled_by_default: true
    current_2:
      name: Current Grinder
      disabled_by_default: true
    active_power_1:
      name: Power Coffee Maker
      id: power_coffee
      # Dual R3 v1: шунт подключён наоборот, нагрузка приходит со знаком минус
      filters:
        - multiply: -1
      on_value:
        - component.update: power_total
    active_power_2:
      name: Power Grinder
      id: power_grinder
      filters:
        - multiply: -1
      on_value:
        - component.update: power_total

  - platform: template
    name: Total Power
    id: power_total
    icon: mdi:flash
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      float a = id(power_coffee).has_state() ? id(power_coffee).state : 0.0f;
      float b = id(power_grinder).has_state() ? id(power_grinder).state : 0.0f;
      return a + b;

  - platform: total_daily_energy
    name: Energy Today
    power_id: power_total
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: integration
    name: Energy This Month
    id: energy_month
    sensor: power_total
    time_unit: h
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # каждый кадр весов для остановки помола; в HA уходит прореженная копия ниже
  - platform: template
    id: scale_weight
    internal: true
    unit_of_measurement: g
    device_class: weight
    accuracy_decimals: 1
    update_interval: never

  - platform: copy
    source_id: scale_weight
    name: Scale Weight
    icon: mdi:scale
    state_class: measurement
    filters:
      - throttle: 500ms
      - delta: 0.1

  - platform: ble_client
    ble_client_id: dot_scale
    type: characteristic
    # тот же вес публикуется в Scale Weight; в HA отдельно не показываем
    internal: true
    id: dot_weight
    service_uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    characteristic_uuid: "0000fff1-0000-1000-8000-00805f9b34fb"
    notify: true
    # Уведомления каждые 100 мс. Опрос FFF1 не обязателен и может дать status=2.
    update_interval: 60s
    unit_of_measurement: g
    device_class: weight
    accuracy_decimals: 1
    lambda: |-
      static uint8_t buf[40];
      static uint8_t len = 0;
      for (size_t i = 0; i < x.size() && len < sizeof(buf); i++)
        buf[len++] = x[i];
      float grams = NAN;
      while (len >= 6) {
        size_t start = 0;
        while (start + 1 < len && !(buf[start] == 0xA5 && buf[start + 1] == 0x5A))
          start++;
        if (start > 0) {
          memmove(buf, buf + start, len - start);
          len -= start;
        }
        if (len < 6 || buf[0] != 0xA5 || buf[1] != 0x5A)
          break;
        uint16_t plen = ((uint16_t) buf[4] << 8) | buf[5];
        if (plen > 24) {
          memmove(buf, buf + 1, --len);
          continue;
        }
        size_t full = 8u + plen;
        if (len < full)
          break;
        if (buf[2] == 0x01 && buf[3] == 0x01 && plen >= 9) {
          int32_t raw = (int32_t) (((uint32_t) buf[6] << 24) | ((uint32_t) buf[7] << 16) |
                                   ((uint32_t) buf[8] << 8) | buf[9]);
          grams = raw / 10.0f;
          id(dot_last_ms) = millis();
          int16_t flow_raw = (int16_t) (((uint16_t) buf[10] << 8) | buf[11]);
          float flow = flow_raw / 10.0f;
          if (flow < 0.0f || flow > 20.0f)
            flow = 0.0f;
          id(dot_flow_gps) = flow;
        }
        memmove(buf, buf + full, len - full);
        len = (uint8_t) (len - full);
      }
      if (!isnan(grams) && id(use_dot).state)
        id(scale_weight).publish_state(grams);
      if (isnan(grams))
        return id(dot_weight).has_state() ? id(dot_weight).state : NAN;
      return grams;

  - platform: template
    name: Profile Dose
    id: profile_target_weight
    icon: mdi:target
    unit_of_measurement: g
    device_class: weight
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    name: Grind Flow
    id: grind_flow
    icon: mdi:speedometer
    unit_of_measurement: g/s
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never
    # во время помола пересчитывается каждые 50 мс; логика берёт grind_rate_gps
    filters:
      - throttle: 1s

  - platform: template
    name: Grind Lead
    id: grind_lead
    icon: mdi:timer-outline
    unit_of_measurement: s
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never

  - platform: template
    name: Grind Error
    id: grind_error
    icon: mdi:delta
    unit_of_measurement: g
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never

  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: Uptime
    update_interval: 300s
    entity_category: diagnostic

switch:
  - platform: gpio
    name: Coffee Maker
    id: relay_coffee
    icon: mdi:coffee-maker
    pin: GPIO27
    restore_mode: ALWAYS_ON
    on_turn_on:
      - script.execute: coffee_idle_timer
      - if:
          condition:
            switch.is_on: use_dot
          then:
            - lambda: id(need_profile_fetch) = true;
            - script.execute: gaggiuino_fetch_status
    on_turn_off:
      - if:
          condition:
            lambda: return !id(coffee_idle_firing);
          then:
            - script.stop: coffee_idle_timer
      - script.stop: gaggiuino_fetch_status
      - script.stop: gaggiuino_fetch_status_run
      - script.stop: gaggiuino_fetch_profile_target
      - lambda: id(need_profile_fetch) = false;
      # помол по весу только пока кофеварка включена
      - if:
          condition:
            script.is_running: grind_weight
          then:
            - script.execute: grind_cancel

  - platform: gpio
    # Реле не отдаём в HA: выключатель включает мотор в обход тарирования и остановки по весу.
    # Помол только с кнопки Grinder Button и с физической кнопки.
    name: Grinder
    id: relay_grinder
    internal: true
    icon: mdi:coffee
    pin: GPIO14
    restore_mode: ALWAYS_OFF
    on_turn_on:
      # помол — активность, отсчёт 3 часов заново
      - script.execute: coffee_idle_timer
    # Только стоп скриптов (без повторного turn_off) — иначе re-entrant crash
    on_turn_off:
      - if:
          condition:
            lambda: return !id(grind_stopping);
          then:
            - script.stop: grind_time
            - script.stop: grind_weight
            - script.stop: grind_weight_watchdog
            - script.stop: grind_prepare_target

  # ON = помол по весу Timemore, OFF = помол по таймеру
  - platform: template
    name: Timemore Scale
    id: use_dot
    icon: mdi:scale-bathroom
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      # доза с Gaggiuino только пока кофеварка включена; вес Timemore идёт и без неё
      - if:
          condition:
            switch.is_on: relay_coffee
          then:
            - lambda: id(need_profile_fetch) = true;
            - script.execute: gaggiuino_fetch_status
      - lambda: id(dot_release) = false;
      - script.stop: dot_back_later
      - script.execute: dot_scan_now
    on_turn_off:
      - lambda: |-
          id(dot_release) = true;
          id(dot_connecting) = false;
      - script.stop: dot_scan_now
      - script.stop: dot_scan_later
      - script.stop: dot_back_later
      - script.stop: dot_hello
      - esp32_ble_tracker.stop_scan:
      - lambda: |-
          ESP_LOGI("scale", "Timemore Scale off, disconnect");
          id(dot_scale).unconditional_disconnect();

  # Перед помолом обнулить Timemore и подождать, пока вес осядет на нуле
  - platform: template
    name: Grind Auto Tare
    id: grind_auto_tare
    icon: mdi:scale-balance
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

script:
  - id: coffee_idle_timer
    mode: restart
    then:
      - delay: ${coffee_idle_off}
      - if:
          condition:
            switch.is_on: relay_coffee
          then:
            - logger.log: "Coffee maker idle for ${coffee_idle_off}, turning off"
            - lambda: id(coffee_idle_firing) = true;
            - switch.turn_off: relay_coffee
            - lambda: id(coffee_idle_firing) = false;

  - id: grind_cancel
    mode: single
    then:
      - lambda: id(grind_stopping) = true;
      - script.stop: grind_time
      - script.stop: grind_weight
      - script.stop: grind_weight_watchdog
      - script.stop: grind_prepare_target
      - script.stop: gaggiuino_fetch_status
      - script.stop: gaggiuino_fetch_status_run
      - script.stop: gaggiuino_fetch_profile_target
      - switch.turn_off: relay_grinder
      - lambda: id(grind_stopping) = false;

  # Пока «Timemore Scale» включена, ищем весы пачками по 15 с.
  # on_turn_on после перезагрузки не вызывается, поэтому тот же скрипт стартует с on_boot.
  - id: dot_scan_now
    mode: single
    then:
      - if:
          condition:
            and:
              - switch.is_on: use_dot
              - binary_sensor.is_off: dot_connected
              - lambda: return !id(dot_connecting) && !id(dot_release);
          then:
            - logger.log: "Timemore: scanning"
            - esp32_ble_tracker.start_scan:

  - id: dot_scan_later
    mode: restart
    then:
      - delay: 4s
      # поиск сервисов Dot идёт ~5 с; повторный connect в это время рвёт связь
      - lambda: |-
          auto st = id(dot_scale).state();
          if (st != esp32_ble_tracker::ClientState::CONNECTING &&
              st != esp32_ble_tracker::ClientState::CONNECTED &&
              st != esp32_ble_tracker::ClientState::ESTABLISHED)
            id(dot_connecting) = false;
      - script.execute: dot_scan_now

  # После обрыва не подключаться сразу.
  - id: dot_back_later
    mode: restart
    then:
      - delay: 12s
      - lambda: id(dot_release) = false;
      - script.execute: dot_scan_now

  # После подключения разбудить поток кадров: граммы и запросы, как в приложении Timemore.
  - id: dot_hello
    mode: single
    then:
      # дать сопряжению закончиться, потом заново включить уведомления уже по шифрованной связи
      - delay: 1500ms
      - lambda: |-
          if (!id(dot_scale).connected() || id(dot_tare_handle) == 0) {
            id(dot_hello_i) = 6;
            return;
          }
          if (id(dot_cccd_handle) != 0) {
            uint8_t on[2] = {0x01, 0x00};
            esp_ble_gattc_write_char_descr(
                (esp_gatt_if_t) id(dot_scale).get_gattc_if(), id(dot_scale).get_conn_id(),
                id(dot_cccd_handle), sizeof(on), on, ESP_GATT_WRITE_TYPE_RSP, ESP_GATT_AUTH_REQ_NONE);
          }
      - delay: 200ms
      - lambda: |-
          if (!id(dot_scale).connected() || id(dot_tare_handle) == 0) {
            id(dot_hello_i) = 6;
            return;
          }
          uint8_t cmd[9] = {0xA5, 0x5A, 0x03, 0x06, 0x00, 0x01, 0x00, 0xE8, 0xA7};
          esp_ble_gattc_write_char(
              (esp_gatt_if_t) id(dot_scale).get_gattc_if(), id(dot_scale).get_conn_id(),
              id(dot_tare_handle), sizeof(cmd), cmd, ESP_GATT_WRITE_TYPE_NO_RSP, ESP_GATT_AUTH_REQ_NONE);
          id(dot_hello_i) = 0;
      - while:
          condition:
            lambda: return id(dot_hello_i) < 6;
          then:
            - delay: 160ms
            - lambda: |-
                if (!id(dot_scale).connected() || id(dot_tare_handle) == 0) {
                  id(dot_hello_i) = 6;
                  return;
                }
                static const uint8_t q[6][8] = {
                    {0xA5, 0x5A, 0x02, 0x13, 0x00, 0x00, 0x9E, 0xB0},
                    {0xA5, 0x5A, 0x02, 0x08, 0x00, 0x00, 0x99, 0xC0},
                    {0xA5, 0x5A, 0x02, 0x05, 0x00, 0x00, 0x5A, 0x51},
                    {0xA5, 0x5A, 0x02, 0x02, 0x00, 0x00, 0x9B, 0xE0},
                    {0xA5, 0x5A, 0x02, 0x06, 0x00, 0x00, 0x5A, 0xA1},
                    {0xA5, 0x5A, 0x02, 0x0C, 0x00, 0x00, 0x58, 0x81},
                };
                uint8_t i = id(dot_hello_i);
                esp_ble_gattc_write_char(
                    (esp_gatt_if_t) id(dot_scale).get_gattc_if(), id(dot_scale).get_conn_id(),
                    id(dot_tare_handle), 8, (uint8_t *) q[i], ESP_GATT_WRITE_TYPE_NO_RSP,
                    ESP_GATT_AUTH_REQ_NONE);
                id(dot_hello_i) = i + 1;

  # Обнуление Timemore. Кнопка Scale Tare и Grind Auto Tare вызывают один скрипт.
  # Пишем сами: ble_write ждёт ответ весов и может зависнуть, не включив мотор.
  - id: dot_tare
    mode: single
    then:
      - lambda: |-
          float w = id(scale_weight).has_state() ? id(scale_weight).state : -1.0f;
          bool gatt = id(dot_scale).connected();
          ESP_LOGI("grind", "tare request weight=%.2f dot_switch=%d link=%d gatt=%d handle=%u props=0x%02X",
                   w, (int) id(use_dot).state, (int) id(dot_connected).state,
                   (int) gatt, id(dot_tare_handle), id(dot_tare_props));
          if (!gatt || id(dot_tare_handle) == 0)
            return;
          // A5 5A 03 0D 00 00 64 D1 — тара Dot, запись без ответа на FFF2
          uint8_t cmd[8] = {0xA5, 0x5A, 0x03, 0x0D, 0x00, 0x00, 0x64, 0xD1};
          esp_err_t err = esp_ble_gattc_write_char(
              (esp_gatt_if_t) id(dot_scale).get_gattc_if(), id(dot_scale).get_conn_id(),
              id(dot_tare_handle), sizeof(cmd), cmd, ESP_GATT_WRITE_TYPE_NO_RSP, ESP_GATT_AUTH_REQ_NONE);
          ESP_LOGI("grind", "tare write err=%d", (int) err);
      - delay: 400ms
      - lambda: |-
          float w = id(scale_weight).has_state() ? id(scale_weight).state : -1.0f;
          if (!id(dot_scale).connected() || id(dot_tare_handle) == 0 || fabsf(w) < 1.0f)
            return;
          uint8_t cmd[8] = {0xA5, 0x5A, 0x03, 0x0D, 0x00, 0x00, 0x64, 0xD1};
          esp_err_t err = esp_ble_gattc_write_char(
              (esp_gatt_if_t) id(dot_scale).get_gattc_if(), id(dot_scale).get_conn_id(),
              id(dot_tare_handle), sizeof(cmd), cmd, ESP_GATT_WRITE_TYPE_NO_RSP, ESP_GATT_AUTH_REQ_NONE);
          ESP_LOGI("grind", "tare write again err=%d weight=%.2f", (int) err, w);
      - wait_until:
          condition:
            lambda: |-
              return id(scale_weight).has_state() && fabsf(id(scale_weight).state) < 1.0f;
          timeout: 2.5s
      - delay: 400ms
      - lambda: |-
          float w = id(scale_weight).has_state() ? id(scale_weight).state : -1.0f;
          if (fabsf(w) < 1.0f)
            ESP_LOGI("grind", "Timemore tare ok, weight=%.2f", w);
          else
            ESP_LOGW("grind", "Timemore tare failed, weight is still %.2f", w);
          id(dot_tare_done) = true;

  - id: gaggiuino_fetch_status
    mode: single
    then:
      - if:
          condition:
            switch.is_on: relay_coffee
          then:
            - script.execute: gaggiuino_fetch_status_run
            - script.wait: gaggiuino_fetch_status_run

  - id: gaggiuino_fetch_status_run
    mode: single
    then:
      - http_request.get:
          url: http://${gaggiuino_host}/api/system/status
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        JsonDocument doc;
                        DeserializationError err = deserializeJson(doc, body);
                        if (err || doc.isNull()) {
                          ESP_LOGW("gaggiuino", "status parse failed: %s len=%u", err.c_str(),
                                   (unsigned) body.size());
                          return;
                        }
                        JsonObject obj = doc.is<JsonArray>() ? doc[0].as<JsonObject>() : doc.as<JsonObject>();
                        // profileId бывает и числом, и строкой "7".
                        // is<const char*>() для строки из JSON часто false, as<int>() тогда даёт 0.
                        int pid = 0;
                        JsonVariant pidv = obj["profileId"];
                        if (!pidv.isNull()) {
                          if (pidv.is<int>() || pidv.is<float>())
                            pid = pidv.as<int>();
                          const char *pids = pidv.as<const char *>();
                          if (pid <= 0 && pids != nullptr && *pids != '\0')
                            pid = atoi(pids);
                        }
                        if (pid > 0) {
                          if (pid != id(gaggiuino_profile_id) || !id(profile_target_weight).has_state())
                            id(need_profile_fetch) = true;
                          id(gaggiuino_profile_id) = pid;
                        } else {
                          const char *raw = obj["profileId"].as<const char *>();
                          ESP_LOGW("gaggiuino", "profileId unparsed: %s", raw != nullptr ? raw : "(null)");
                        }
                        if (!obj["profileName"].isNull()) {
                          std::string pname = obj["profileName"].as<std::string>();
                          if (!id(gaggiuino_profile_name).has_state() || id(gaggiuino_profile_name).state != pname)
                            id(gaggiuino_profile_name).publish_state(pname);
                        }
                  else:
                    - logger.log:
                        level: WARN
                        format: "Gaggiuino status HTTP %d"
                        args: ["response->status_code"]
          on_error:
            then:
              - logger.log:
                  level: WARN
                  format: "Gaggiuino status unreachable (${gaggiuino_host})"
      # профиль только после того, как статус уже записал id
      - if:
          condition:
            lambda: return id(need_profile_fetch) && id(gaggiuino_profile_id) > 0;
          then:
            - script.execute: gaggiuino_fetch_profile_target

  - id: gaggiuino_fetch_profile_target
    mode: single
    then:
      - if:
          condition:
            and:
              - switch.is_on: relay_coffee
              - lambda: return id(gaggiuino_profile_id) > 0;
          then:
            - http_request.get:
                url: !lambda |-
                  return str_sprintf("http://${gaggiuino_host}/api/profile/%d", id(gaggiuino_profile_id));
                capture_response: true
                max_response_buffer_size: 16384
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: return response->status_code == 200;
                        then:
                          - lambda: |-
                              JsonDocument doc;
                              DeserializationError err = deserializeJson(doc, body);
                              if (err) {
                                // не сбрасываем need_profile_fetch — интервал повторит запрос
                                ESP_LOGW("gaggiuino", "profile parse failed: %s len=%u", err.c_str(),
                                         (unsigned) body.size());
                                return;
                              }
                              id(need_profile_fetch) = false;
                              id(gaggiuino_profile_id_fetched) = id(gaggiuino_profile_id);
                              JsonObject root = doc.is<JsonArray>() && doc.size() > 0
                                  ? doc[0].as<JsonObject>()
                                  : doc.as<JsonObject>();
                              auto as_float = [](JsonVariant v) -> float {
                                if (v.isNull()) return NAN;
                                if (v.is<const char *>()) {
                                  const char *s = v.as<const char *>();
                                  if (s == nullptr || *s == '\0') return NAN;
                                  return strtof(s, nullptr);
                                }
                                return v.as<float>();
                              };
                              float target = NAN;
                              if (root["recipe"].is<JsonObject>()) {
                                JsonObject recipe = root["recipe"].as<JsonObject>();
                                std::string recipe_dump;
                                serializeJson(recipe, recipe_dump);
                                ESP_LOGI("gaggiuino", "recipe=%s", recipe_dump.c_str());
                                target = as_float(recipe["coffeeIn"]);
                                if (isnan(target) || target <= 0.0f) target = as_float(recipe["dose"]);
                                if (isnan(target) || target <= 0.0f) target = as_float(recipe["coffee"]);
                                if (isnan(target) || target <= 0.0f) target = as_float(recipe["in"]);
                              } else {
                                ESP_LOGW("gaggiuino", "no recipe object in profile");
                              }
                              if (!isnan(target) && target > 0.0f) {
                                id(profile_target_weight).publish_state(target);
                                id(grind_target_g) = target;
                                ESP_LOGI("gaggiuino", "dose=%.2fg", target);
                              } else {
                                ESP_LOGW("gaggiuino", "empty dose — set coffeeIn in Gaggiuino recipe");
                              }
                        else:
                          - logger.log:
                              level: WARN
                              format: "Gaggiuino profile HTTP %d"
                              args: [response->status_code]
                on_error:
                  then:
                    - logger.log:
                        level: WARN
                        format: "Gaggiuino profile unreachable"
          else:
            - if:
                condition:
                  switch.is_on: relay_coffee
                then:
                  - logger.log:
                      level: WARN
                      format: "Skip profile fetch, profileId=%d"
                      args: ["id(gaggiuino_profile_id)"]

  - id: grind_prepare_target
    mode: single
    then:
      - script.execute: gaggiuino_fetch_status
      - delay: 50ms
      - script.wait: gaggiuino_fetch_status
      - delay: 100ms
      - if:
          condition:
            or:
              - lambda: return id(need_profile_fetch);
              - lambda: return id(gaggiuino_profile_id_fetched) != id(gaggiuino_profile_id);
          then:
            - script.execute: gaggiuino_fetch_profile_target
            - delay: 50ms
            - script.wait: gaggiuino_fetch_profile_target
            - delay: 100ms
      - lambda: |-
          float ov = id(grind_target_override).state;
          if (ov > 0.0f) {
            id(grind_target_g) = ov;
            id(profile_target_weight).publish_state(ov);
          }
          ESP_LOGI("grind", "target=%.2fg scale=%.2fg", id(grind_target_g), id(scale_weight).state);

  - id: grind_time
    mode: restart
    then:
      - switch.turn_on: relay_grinder
      - delay: !lambda "return roundf(id(grind_seconds).state * 1000.0f);"
      - if:
          condition:
            lambda: return !id(grind_stopping);
          then:
            - switch.turn_off: relay_grinder

  - id: grind_weight
    mode: restart
    then:
      - script.execute: grind_prepare_target
      - script.wait: grind_prepare_target
      - if:
          condition:
            lambda: |-
              if (!(id(grind_target_g) > 0.0f) || isnan(id(grind_target_g)))
                return false;
              if (!id(dot_connected).state || !id(scale_weight).has_state()) {
                ESP_LOGW("grind", "Timemore not connected, no weight");
                return false;
              }
              return true;
          then:
            - if:
                condition:
                  and:
                    - switch.is_on: grind_auto_tare
                    - switch.is_on: use_dot
                then:
                  # script.wait сразу после execute часто видит «скрипт ещё не запущен»
                  # и отпускает помол до команды тары. Ждём флаг, который ставится в конце скрипта.
                  - lambda: id(dot_tare_done) = false;
                  - script.execute: dot_tare
                  - wait_until:
                      condition:
                        lambda: return id(dot_tare_done);
                      timeout: 6s
                else:
                  - lambda: |-
                      ESP_LOGI("grind", "auto tare off: switch=%d scale=%d",
                               id(grind_auto_tare).state, id(use_dot).state);
            - lambda: |-
                float w = id(scale_weight).has_state() ? id(scale_weight).state : 0.0f;
                // автотарирование включено, а ноль не пришёл — мотор не трогаем,
                // иначе поздний ноль уведёт дельту в минус и помол не остановится
                if (id(grind_auto_tare).state && id(use_dot).state && fabsf(w) >= 1.0f) {
                  id(grind_stopping) = true;
                  ESP_LOGW("grind", "abort grind, tare failed weight=%.2f", w);
                  return;
                }
                id(grind_stopping) = false;
                id(grind_start_weight) = w;
                id(grind_prev_g) = 0.0f;
                id(grind_prev_ms) = millis();
                // поток прошлого помола не используем: он был завышен скачками по 0,1 г
                id(grind_rate_gps) = 0.0f;
                id(dot_flow_gps) = 0.0f;
                ESP_LOGI("grind", "start_weight=%.2f target=%.2f lead=%.2fs early=%.2fg",
                         id(grind_start_weight), id(grind_target_g), id(grind_lead_s),
                         id(grind_stop_early).state);
            - if:
                condition:
                  lambda: return !id(grind_stopping);
                then:
                  - switch.turn_on: relay_grinder
            - while:
                condition:
                  and:
                    - switch.is_on: relay_grinder
                    - lambda: |-
                        float early = id(grind_stop_early).state;
                        if (isnan(early) || early < 0.0f)
                          early = 0.0f;
                        float rate = id(grind_rate_gps);
                        float lead = id(grind_lead_s);
                        if (isnan(lead) || lead < 0.15f)
                          lead = 0.15f;
                        // пока поток ещё не измерен, держим прошлый запас в граммах
                        if (rate >= 0.4f)
                          early = rate * lead;
                        // при ~1,5 г/с нормальный запас около 0,8 г; выше 1,5 г не уходим
                        if (early > 1.5f)
                          early = 1.5f;
                        float delta = id(scale_weight).state - id(grind_start_weight);
                        return !id(grind_stopping) && delta < (id(grind_target_g) - early);
                then:
                  - delay: 50ms
                  - lambda: |-
                      float live = id(dot_flow_gps);
                      // Dot считает поток сам: int16, единица 100 мг/с
                      if (live >= 0.4f && live <= 3.0f) {
                        float r = id(grind_rate_gps);
                        id(grind_rate_gps) = (r < 0.4f) ? live : (r * 0.7f + live * 0.3f);
                        id(grind_flow).publish_state(id(grind_rate_gps));
                      }
                      float delta = id(scale_weight).state - id(grind_start_weight);
                      uint32_t now = millis();
                      // первый грамм — разгон, в запасной расчёт по весу не берём
                      if (delta <= 1.0f) {
                        id(grind_prev_g) = delta;
                        id(grind_prev_ms) = now;
                        return;
                      }
                      float dt = (now - id(grind_prev_ms)) / 1000.0f;
                      if (dt < 0.7f)
                        return;
                      float inst = (delta - id(grind_prev_g)) / dt;
                      id(grind_prev_g) = delta;
                      id(grind_prev_ms) = now;
                      if (live >= 0.4f)
                        return;
                      if (inst >= 0.4f && inst <= 3.0f) {
                        float r = id(grind_rate_gps);
                        id(grind_rate_gps) = (r < 0.4f) ? inst : (r * 0.6f + inst * 0.4f);
                        id(grind_flow).publish_state(id(grind_rate_gps));
                      }
            - if:
                condition:
                  lambda: return !id(grind_stopping);
                then:
                  # grind_stopping на время turn_off, иначе on_turn_off реле остановит этот же скрипт
                  # и поправка после оседания веса не посчитается
                  - lambda: |-
                      id(grind_cutoff_g) = id(scale_weight).state - id(grind_start_weight);
                      id(grind_stopping) = true;
                  - switch.turn_off: relay_grinder
                  - lambda: id(grind_stopping) = false;
                  - script.stop: grind_weight_watchdog
                  - logger.log:
                      format: "Grind motor off at %.2fg, flow %.2f g/s, lead %.2fs"
                      args: ["id(grind_cutoff_g)", "id(grind_rate_gps)", "id(grind_lead_s)"]
                  # зёрна ещё падают; чашку не снимать, иначе поправка испортится
                  - delay: 2500ms
                  - lambda: |-
                      if (id(grind_stopping))
                        return;
                      float settled = id(scale_weight).state - id(grind_start_weight);
                      float cutoff = id(grind_cutoff_g);
                      float target = id(grind_target_g);
                      float rate = id(grind_rate_gps);
                      if (settled < cutoff - 1.5f) {
                        ESP_LOGW("grind", "skip lead learn, cup moved settled=%.2f cutoff=%.2f", settled, cutoff);
                        return;
                      }
                      if (!(rate >= 0.4f)) {
                        ESP_LOGW("grind", "skip lead learn, flow=%.2f g/s", rate);
                        return;
                      }
                      float error = settled - target;
                      float lead = id(grind_lead_s);
                      if (isnan(lead) || lead < 0.15f)
                        lead = 0.5f;
                      lead = lead + 0.5f * (error / rate);
                      if (lead < 0.15f) lead = 0.15f;
                      if (lead > 2.0f) lead = 2.0f;
                      float grams = lead * rate;
                      if (grams > 1.5f) {
                        grams = 1.5f;
                        lead = grams / rate;
                      }
                      id(grind_lead_s) = lead;
                      id(grind_last_error_g) = error;
                      id(grind_flow).publish_state(rate);
                      id(grind_lead).publish_state(lead);
                      id(grind_error).publish_state(error);
                      ESP_LOGI("grind", "settled=%.2f target=%.2f error=%+.2f flow=%.2f lead=%.2fs early=%.2fg",
                               settled, target, error, rate, lead, grams);
                      auto call = id(grind_stop_early).make_call();
                      call.set_value(grams);
                      call.perform();
            - if:
                condition:
                  lambda: return id(grind_stopping);
                then:
                  - script.stop: grind_weight_watchdog
                  - lambda: id(grind_stopping) = false;
          else:
            - logger.log: "No grind target weight — abort"

  - id: grind_weight_watchdog
    mode: restart
    then:
      - delay: ${grind_weight_max_s}s
      - if:
          condition:
            switch.is_on: relay_grinder
          then:
            - logger.log: "Grind watchdog timeout"
            - script.execute: grind_cancel

  # Физическая кнопка и кнопка в HA
  - id: grind_button
    mode: restart
    then:
      - script.execute: coffee_idle_timer
      - if:
          condition:
            or:
              - switch.is_on: relay_grinder
              - script.is_running: grind_time
              - script.is_running: grind_weight
          then:
            - script.execute: grind_cancel
          else:
            - if:
                condition:
                  and:
                    - switch.is_on: relay_coffee
                    - switch.is_on: use_dot
                    - binary_sensor.is_on: dot_connected
                then:
                  - script.execute: grind_weight
                  - script.execute: grind_weight_watchdog
                else:
                  # без кофеварки или без подключённых весов — по таймеру Grind Time
                  - script.execute: grind_time

interval:
  # «Decent Scale» виден Gaggiuino, только пока Timemore подключены и шлют вес.
  # Если подключиться к пустому мосту, Gaggiuino остаётся на нуле до своей перезагрузки.
  - interval: 1s
    then:
      - lambda: |-
          auto *srv = id(decent_server);
          if (!srv->is_running())
            return;
          bool live = id(dot_connected).state && id(dot_last_ms) != 0 &&
                      millis() - id(dot_last_ms) < 3000;
          if (live && !id(decent_adv)) {
            esp32_ble::global_ble->advertising_start();
            id(decent_adv) = true;
            ESP_LOGI("decent", "Timemore live, advertising Decent Scale");
          } else if (!live) {
            if (id(decent_adv)) {
              esp32_ble::global_ble->advertising_stop();
              id(decent_adv) = false;
              ESP_LOGI("decent", "Timemore gone, stop advertising");
            }
            const uint16_t *clients = srv->get_clients();
            uint8_t n = srv->get_client_count();
            for (uint8_t i = 0; i < n; i++)
              esp_ble_gatts_close(srv->get_gatts_if(), clients[i]);
            if (n > 0)
              ESP_LOGI("decent", "drop %u Gaggiuino client(s) without Timemore", n);
          }
  # Настоящие Decent шлют вес 10 раз в секунду сразу после подключения.
  # Если молчать, пока Timemore выключены, Gaggiuino остаётся на нуле до своей перезагрузки.
  - interval: 100ms
    then:
      - lambda: |-
          if (!id(decent_client))
            return;
          float grams = 0.0f;
          if (id(dot_connected).state && id(scale_weight).has_state() && !isnan(id(scale_weight).state))
            grams = id(scale_weight).state;
          long w = lroundf(grams * 10.0f);
          if (w > 32767) w = 32767;
          if (w < -32768) w = -32768;
          uint16_t u = (uint16_t) (int16_t) w;
          uint8_t f[7] = {0x03, 0xCE, (uint8_t) (u >> 8), (uint8_t) (u & 0xFF), 0x00, 0x00, 0x00};
          for (int i = 0; i < 6; i++)
            f[6] ^= f[i];
          id(decent_weight)->set_value(f, sizeof(f));
          // FFF4 — первая характеристика сервиса, её значение лежит на handle сервиса + 2
          uint16_t handle = id(decent_weight)->get_service()->get_handle() + 2;
          auto *srv = id(decent_server);
          const uint16_t *clients = srv->get_clients();
          uint8_t n = srv->get_client_count();
          for (uint8_t i = 0; i < n; i++)
            esp_ble_gatts_send_indicate(srv->get_gatts_if(), clients[i], handle, sizeof(f), f, false);
  # HTTP только если нужен профиль — иначе запрос к мёртвому хосту роняет Task WDT
  - interval: 10s
    then:
      - if:
          condition:
            and:
              - switch.is_on: relay_coffee
              - switch.is_on: use_dot
              - not:
                  script.is_running: grind_weight
              - not:
                  script.is_running: grind_prepare_target
              - not:
                  script.is_running: gaggiuino_fetch_status
              - not:
                  script.is_running: gaggiuino_fetch_status_run
              - not:
                  script.is_running: gaggiuino_fetch_profile_target
          then:
            - if:
                condition:
                  lambda: return id(need_profile_fetch) && id(gaggiuino_profile_id) > 0;
                then:
                  - script.execute: gaggiuino_fetch_profile_target
                else:
                  - script.execute: gaggiuino_fetch_status

binary_sensor:
  - platform: template
    id: dot_connected
    name: Timemore Connected
    device_class: connectivity
    entity_category: diagnostic

  # S2 — кнопка кофемолки
  - platform: gpio
    name: Button Grinder
    id: btn_grinder
    pin:
      number: GPIO33
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - script.execute: grind_button
